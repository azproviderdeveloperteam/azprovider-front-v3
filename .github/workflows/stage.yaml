name: Stage CI/CD


env:
  REPOSITORY: git@github.com:${{github.repository}}.git
  PROJECT_NAME : ${{ github.event.repository.name }}
  WORK_DIR : /home/frontend
  DOCKER_HUB_URL : docker.io


on:
  push:
    branches: [ master ]


jobs:
  Clone:
    runs-on: ubuntu-latest
    steps:
    - name: Clone
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.STAGE_HOST }}
        username: ${{ secrets.STAGE_USERNAME }}
        key: ${{ secrets.STAGE_PRIVATE_KEY }}
        port: ${{ secrets.STAGE_PORT }}
        script: |
          mkdir -p ${{env.WORK_DIR}}
          cd ${{env.WORK_DIR}}
          rm -r ${{env.PROJECT_NAME}}
          git clone -b master ${{env.REPOSITORY}}
          cd ${{env.PROJECT_NAME}}
          git checkout stage
          git pull
          git status
    

  Build:
    needs: Clone
    runs-on: ubuntu-latest
    steps:
    - name: Build
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.STAGE_HOST }}
        username: ${{ secrets.STAGE_USERNAME }}
        key: ${{ secrets.STAGE_PRIVATE_KEY }}
        port: ${{ secrets.STAGE_PORT }}
        script: |
          cd ${{env.WORK_DIR}}/${{env.PROJECT_NAME}}

          echo " ------------- Login to Dockerhub -------------"
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login ${{ env.DOCKER_HUB_URL }} -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

          echo " ------------- docker build nextjs image -------------"
          docker compose -f docker-compose.stage.yml build --pull 
          

  Deploy:
    needs: Build
    runs-on: ubuntu-latest
    steps:
    - name: Build
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.STAGE_HOST }}
        username: ${{ secrets.STAGE_USERNAME }}
        key: ${{ secrets.STAGE_PRIVATE_KEY }}
        port: ${{ secrets.STAGE_PORT }}
        script: |
          cd ${{env.WORK_DIR}}/${{env.PROJECT_NAME}}
          
          echo " ------------- docker up nextjs container --------------"
          docker compose -f docker-compose.stage.yml up -d --force-recreate --no-build
    
          echo "------------- docker prune old image ---------------"
          docker container prune --force
          docker image prune --force
          docker volume prune --force

          echo "------------- docker restart -----------------"
          docker restart $(docker ps -q)